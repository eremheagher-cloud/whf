name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
        
        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

    - name: Enable RDP
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create User Account
      run: |
        Write-Host "Setting up user account..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

    - name: Install Tailscale (Silent)
      run: |
        Write-Host "Downloading Tailscale for Windows ARM64..." -ForegroundColor Green

        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.5-x86.msi"
        $installerPath = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

        if (-not (Test-Path $installerPath)) {
          Write-Host "Tailscale installer was not downloaded." -ForegroundColor Red
          exit 1
        }

        Write-Host "Installing Tailscale..." -ForegroundColor Green

        $installProcess = Start-Process msiexec.exe `
          -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
          -Wait `
          -PassThru

        if ($installProcess.ExitCode -ne 0) {
          Write-Host "Tailscale installation failed. Exit code: $($installProcess.ExitCode)" -ForegroundColor Red
          exit 1
        }

        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

        Write-Host "Tailscale installed successfully!" -ForegroundColor Green

    - name: Start Tailscale
      run: |
        Write-Host "Starting Tailscale..." -ForegroundColor Green

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $tailscaleExe)) {
          Write-Host "Tailscale executable was not found." -ForegroundColor Red
          exit 1
        }

        Write-Host "Checking required Windows services..." -ForegroundColor Yellow

        $requiredServices = @(
          "Dnscache",
          "iphlpsvc",
          "netprofm",
          "WinHttpAutoProxySvc"
        )

        foreach ($serviceName in $requiredServices) {
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Host "Required service not found: $serviceName" -ForegroundColor Red
            exit 1
          }

          if ($service.Status -ne "Running") {
            Write-Host "Starting required service: $serviceName" -ForegroundColor Yellow
            Start-Service -Name $serviceName -ErrorAction SilentlyContinue
          }

          Write-Host "$serviceName : $((Get-Service -Name $serviceName).Status)" -ForegroundColor Cyan
        }

        Write-Host "Checking Tailscale service..." -ForegroundColor Yellow

        $tailscaleService = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

        if (-not $tailscaleService) {
          Write-Host "Tailscale service was not found." -ForegroundColor Red
          exit 1
        }

        if ($tailscaleService.Status -ne "Running") {
          Write-Host "Starting Tailscale service..." -ForegroundColor Yellow
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
        }

        $tailscaleService = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

        Write-Host "Tailscale service status: $($tailscaleService.Status)" -ForegroundColor Cyan

        if ($tailscaleService.Status -ne "Running") {
          Write-Host "Tailscale service failed to start." -ForegroundColor Red
          exit 1
        }

        Write-Host "Tailscale service is running!" -ForegroundColor Green

        Write-Host "Disabling Tailscale DNS configuration..." -ForegroundColor Yellow

        & $tailscaleExe set --accept-dns=false 2>&1

        Start-Sleep -Seconds 5

        Write-Host "Connecting Tailscale..." -ForegroundColor Green

        & $tailscaleExe up `
          --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
          --hostname="enigmano-${{ github.run_id }}" `
          --accept-routes `
          --accept-dns=false `
          --force-reauth

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tailscale up failed with exit code $LASTEXITCODE." -ForegroundColor Red
          & $tailscaleExe status 2>&1
          exit 1
        }

        Write-Host "Tailscale authentication command completed." -ForegroundColor Green

        Write-Host "Waiting for Tailscale IPv4 address..." -ForegroundColor Yellow

        $tsIP = $null

        for ($i = 1; $i -le 12; $i++) {

          Start-Sleep -Seconds 5

          $tsIP = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()

          if ($tsIP -match "^\d{1,3}(\.\d{1,3}){3}$") {
            Write-Host "Tailscale IPv4: $tsIP" -ForegroundColor Green
            break
          }

          Write-Host "Waiting for Tailscale IP... attempt $i/12" -ForegroundColor Yellow
        }

        if (-not ($tsIP -match "^\d{1,3}(\.\d{1,3}){3}$")) {
          Write-Host "Tailscale did not obtain an IPv4 address." -ForegroundColor Red
          Write-Host "Tailscale status:" -ForegroundColor Yellow
          & $tailscaleExe status 2>&1
          exit 1
        }

        Write-Host "Tailscale is ready!" -ForegroundColor Green

    - name: Get Tailscale IP
      run: |
        $tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1).Trim()

        if (-not ($tsIP -match "^\d{1,3}(\.\d{1,3}){3}$")) {
          Write-Host "Unable to obtain Tailscale IPv4 address." -ForegroundColor Red
          exit 1
        }

        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green
        echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Install Google Chrome (Direct)
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green
        $chromeUrl = "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise_arm64.msi"
        $installerPath = "$env:TEMP\chrome_installer.msi"
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green
        Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /qn /norestart" -Wait
        Remove-Item $installerPath -Force
        Write-Host "Google Chrome installed!" -ForegroundColor Green

    - name: Install 7-Zip (Direct)
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green
        $zipUrl = "https://www.7-zip.org/a/7z2409-arm64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
        Remove-Item $installerPath -Force
        Write-Host "7-Zip installed!" -ForegroundColor Green

    - name: Connection Details
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green
        Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║         ENIGMANO RDP ACCESS          ║" -ForegroundColor Cyan
        Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ Host: $env:TAILSCALE_IP              ║" -ForegroundColor White
        Write-Host "║ Username: runneradmin                ║" -ForegroundColor White
        Write-Host "║ Password: P@ssw0rd!                  ║" -ForegroundColor White
        Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan
        
        Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
        Write-Host "1. Install Tailscale on your device (phone, tablet, Mac, Linux)" -ForegroundColor White
        Write-Host "2. Log in with the same Tailscale account" -ForegroundColor White
        Write-Host "3. Open Remote Desktop app and enter the IP above" -ForegroundColor White
        Write-Host "4. Use the provided credentials" -ForegroundColor White

    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        Write-Host "Do not close this window to maintain the connection." -ForegroundColor Red
        
        $counter = 0

        while ($true) {
          $counter++

          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          $tsIP = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()

          if ($tsIP -match "^\d{1,3}(\.\d{1,3}){3}$") {
            Write-Host "Tailscale status: ACTIVE - $tsIP" -ForegroundColor Green
          } else {
            Write-Host "Tailscale IP unavailable - restarting connection..." -ForegroundColor Red

            $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

            if ($service -and $service.Status -ne "Running") {
              Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 10
            }

            & $tailscaleExe set --accept-dns=false 2>&1

            & $tailscaleExe up `
              --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
              --hostname="enigmano-${{ github.run_id }}" `
              --accept-routes `
              --accept-dns=false `
              --force-reauth
          }
          
          Start-Sleep -Seconds 60
        }
